        fill="none" stroke="#e0a526" stroke-width="30" stroke-linecap="round"/>

  <!-- دوو کەسی لاتەنیشت -->
  <circle cx="140" cy="204" r="37" fill="#ffffff" fill-opacity=".92"/>
  <rect x="94"  y="260" width="92" height="74" rx="32" fill="#ffffff" fill-opacity=".78"/>
  <circle cx="372" cy="204" r="37" fill="#ffffff" fill-opacity=".92"/>
  <rect x="326" y="260" width="92" height="74" rx="32" fill="#ffffff" fill-opacity=".78"/>

  <!-- کەسی ناوەند -->
  <circle cx="256" cy="154" r="52" fill="#e0a526"/>
  <rect x="190" y="222" width="132" height="118" rx="48" fill="#e0a526"/>
</svg>
